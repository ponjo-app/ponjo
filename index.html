<script type="module">
  // The slogan's second half is written once by Clippy, with the app's own face
  // and cursor, and left marked as its edit. Then Clippy stays as a pet: its eyes
  // follow the pointer, it blinks, and a click makes it hop, happy. With reduced
  // motion the slogan is there at once.
  import { agentFace, buddyColor } from './dist/web/faces.js?v=8fccbee';

  // A phone gets a note instead of the downloads; a computer, its own system's download as the primary button.
  const ua = navigator.userAgent;
  if (/Android|iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform))) document.querySelector('.dl-page').classList.add('dl-phone');
  else document.getElementById(/Windows/.test(ua) ? 'windows' : /Mac/.test(navigator.platform) ? 'macos' : '')?.classList.replace('pj-secondary', 'pj-primary');

  const CLIPPY = { body: 'cloud', tilt: -3, eye: 'dot', mouth: 'smile', extra: 'blush' }; // the logo's look

  const stage = document.getElementById('slogan');
  const line = stage.querySelector('h1');
  line.setAttribute('aria-label', line.textContent);
  line.style.cssText = `--buddy: ${buddyColor('Clippy')}; --buddy-ink: #1f1d24`;
  const pace = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms * pace));

  const el = (tag, className = '', text = '') => {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = text;
    return node;
  };

  const pet = el('button', 'pj-agent-face dl-pet');
  pet.type = 'button';
  pet.setAttribute('aria-label', 'Pet Clippy');
  const avatar = el('span', 'pj-avatar pj-avatar-agent');
  avatar.append(agentFace('Clippy', CLIPPY), agentFace('Clippy', { ...CLIPPY, eye: 'happy' }));
  pet.append(avatar);
  const typed = el('span', 'pj-buddy-edit');
  const cursor = el('span', 'pj-cursor');
  cursor.append(el('span', 'pj-cursor-name', 'Clippy'));
  line.replaceChildren('Write together ', el('br'), typed, cursor); // the break is for phones (site.css)
  stage.replaceChildren(pet, line);

  const working = (on) => {
    pet.dataset.presence = on ? 'working' : 'idle';
    cursor.classList.toggle('pj-cursor-working', on);
  };

  await sleep(1200);
  working(true);
  await sleep(600);
  for (const char of 'with your AI buddies') {
    typed.textContent += char;
    await sleep(80);
  }
  working(false);
  await sleep(1200);
  cursor.remove();

  // The pet: its face turns toward the pointer, a little more the farther it is.
  addEventListener('pointermove', (event) => {
    const box = pet.getBoundingClientRect();
    const dx = event.clientX - (box.left + box.width / 2);
    const dy = event.clientY - (box.top + box.height / 2);
    const reach = (Math.min(1, Math.hypot(dx, dy) / 300) * 6) / (Math.hypot(dx, dy) || 1);
    for (const look of pet.querySelectorAll('.pj-face-look')) look.style.transform = `translate(${dx * reach}px, ${dy * reach}px)`;
  });
  let happy;
  pet.addEventListener('click', () => {
    pet.classList.remove('dl-happy');
    void pet.offsetWidth; // restarts the hop on a quick second click
    pet.classList.add('dl-happy');
    clearTimeout(happy);
    happy = setTimeout(() => pet.classList.remove('dl-happy'), 900);
  });
</script>
