# The relay and the teammate's page (docs/app/architecture.md, Sharing), at
# https://share.ponjo.app. Deploy from here with `npm run deploy`, which
# builds the page first (README.md, Deploying the relay).
# The tests run it locally with wrangler (test/relay/harness.js).
name = "ponjo"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false
routes = [{ pattern = "share.ponjo.app", custom_domain = true }]

# The teammate's page, team.html, and what it loads (scripts/build.js).
[assets]
directory = "../dist/web"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Both envs inherit these (worker.js exports both classes). v2 is the game
# tables' own class (table.js): bound only in the hackathon env, unused at
# share.ponjo.app.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Table"]

# Hosts an address connects a minute (worker.js).
[[ratelimits]]
name = "HOSTS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Pages an address opens a minute (worker.js): a page connects again after
# its line drops, and once per doc it opens.
[[ratelimits]]
name = "PAGES"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# The preview's buddies' model (worker.js), at https://infer.ponjo.app,
# deployed by CI (README.md, The preview's buddies). Its key, the
# secret TOKEN_FACTORY_KEY, is the repo's secret of that name, and so is
# ANTHROPIC_API_KEY, which the game tables' AI players run on (table.js).
# The tables are here, not at share.ponjo.app, so that key, its rate and
# the tables' budgets stay in the one Worker that holds it.
[env.hackathon]
name = "ponjo-hackathon"
routes = [{ pattern = "infer.ponjo.app", custom_domain = true }]

[env.hackathon.vars]
ORIGIN = "https://ponjo.app"
ENDPOINT = "https://api.tokenfactory.nebius.com/v1"
MODEL = "nvidia/nemotron-3-super-120b-a12b" # Nemotron 3 Super, which calls tools
ANTHROPIC_ENDPOINT = "https://api.anthropic.com/v1" # the game tables' AI players, with the secret ANTHROPIC_API_KEY or a visitor's own
ANTHROPIC_MODEL = "claude-haiku-5-5"
# Model calls a table makes in a clock hour (table.js): on Ponjo's key, a
# few games of spy or werewolf, or about 30 hands of poker, at most about
# $1 of Haiku 5.5 with every answer at its cap; on a visitor's own key,
# which they pay for, more.
RUNS_AN_HOUR = "300"
OWN_RUNS_AN_HOUR = "600"

# A table per room (table.js).
[[env.hackathon.durable_objects.bindings]]
name = "TABLES"
class_name = "Table"

# Requests an address makes a minute: a turn is a few, up to six. A
# table's calls on Ponjo's key count against the address that opened it.
[[env.hackathon.ratelimits]]
name = "INFER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Lines to a table an address opens a minute (worker.js): a page opens one,
# and again after it drops.
[[env.hackathon.ratelimits]]
name = "SEATS"
namespace_id = "1004"
simple = { limit = 60, period = 60 }
