# The relay and the teammate's page (docs/architecture.md, Sharing), at
# https://share.ponjo.app. Deploy from here with `npm run deploy`, which
# builds the page first (README.md, Deploying the relay).
# The tests run it locally with wrangler (test/relay/harness.js).
name = "ponjo"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false
routes = [{ pattern = "share.ponjo.app", custom_domain = true }]

# The teammate's page, team.html, and what it loads (scripts/build.js).
[assets]
directory = "../dist/web"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Hosts an address connects a minute (worker.js).
[[ratelimits]]
name = "HOSTS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Pages an address opens a minute (worker.js): a page connects again after
# its line drops, and once per doc it opens.
[[ratelimits]]
name = "PAGES"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# The preview's buddies' model (worker.js), at https://infer.ponjo.app,
# deployed with the relay (README.md, Deploying the relay). Its key, the
# secret TOKEN_FACTORY_KEY, is the repo's secret of that name.
[env.hackathon]
name = "ponjo-hackathon"
routes = [{ pattern = "infer.ponjo.app", custom_domain = true }]

[env.hackathon.vars]
ORIGIN = "https://ponjo.app"
ENDPOINT = "https://api.tokenfactory.nebius.com/v1"
MODEL = "nvidia/nemotron-3-super-120b-a12b" # Nemotron 3 Super, which calls tools

# Requests an address makes a minute: a turn is a few.
[[env.hackathon.ratelimits]]
name = "INFER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
