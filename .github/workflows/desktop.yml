# Checks every pull request and push to main. The gate, on Windows and macOS:
# lint, the installers, and a smoke test that opens a doc in the packaged
# app. Pushes to main that pass it replace the "nightly" pre-release
# (https://github.com/ponjo-app/ponjo/releases/tag/nightly), so a build
# that cannot open a doc never replaces a working one, and deploy the relay
# with the teammate's page (https://share.ponjo.app) from the same commit,
# so a teammate sees the owner's UI. The unit tests (npm
# test), the buddy concurrency stress test (npm run test:stress) and the
# latency promise (npm run test:perf) run once, on Linux, and hold it back
# too.
#
# A pull request that changes only docs (docs/ or a top-level *.md) skips the
# installers, the tests and the stress test: the `changes` job decides, and
# the `package` jobs still run and report success so the required checks pass.
# Every push to main runs the full gate. Each night the stress test alone runs
# for 30 minutes of random seeds (docs/testing-ci.md, Editing tests).

name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

# A newer push supersedes a pull request's run; on main every push finishes,
# so no commit there is marked by a cancelled run.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # `code` is true when something other than docs changed, and always for a
    # push or a manual run; never for the nightly run. The heavier jobs key off it.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          echo "changed files:"; echo "$files"
          # Any changed file that is not under docs/ and is not a top-level *.md
          # means code changed.
          if echo "$files" | grep -qvE '^(docs/|[^/]*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # "package (windows)" and "package (macos)" are the checks main's ruleset
    # requires: rename them there too if they change. The job always runs so
    # the required checks report; a docs-only PR skips its steps and passes.
    name: package (${{ matrix.platform }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            args: --mac --arm64 --x64
            app: release/mac-arm64/Ponjo.app/Contents/MacOS/Ponjo
          - platform: windows
            os: windows-latest
            args: --win --x64
            app: release/win-unpacked/Ponjo.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - if: needs.changes.outputs.code == 'true'
        run: npm run build
      - if: needs.changes.outputs.code == 'true' && !(matrix.platform == 'macos' && github.event_name != 'pull_request')
        run: npx electron-builder ${{ matrix.args }} --publish never
      # Pushes and manual runs sign the macOS app with the Developer ID and
      # notarize it; pull requests keep the ad-hoc signature.
      - if: needs.changes.outputs.code == 'true' && matrix.platform == 'macos' && github.event_name != 'pull_request'
        name: Package, signed and notarized
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          npx electron-builder ${{ matrix.args }} --publish never \
            -c.mac.identity="Fan Zhang (N94Q455WA8)" \
            -c.mac.hardenedRuntime=true \
            -c.mac.notarize=true
      - if: needs.changes.outputs.code == 'true'
        name: Smoke test the packaged app
        run: node scripts/smoke-desktop.js ${{ matrix.app }}
        timeout-minutes: 5
      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ponjo-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix relay # wrangler, for the relay test (test/relay.test.js)
      - run: npm run build
      - run: xvfb-run -a npm test # the view contract tests open an Electron window

  perf:
    # The latency promise (docs/architecture.md, Latency): each view at its
    # limits, typed in while a teammate's edits arrive, and a key to a
    # teammate's page through the relay. A few minutes.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix relay # wrangler, for the typing promise (test/perf/typing.test.js)
      - run: xvfb-run -a npm run test:perf # opens an Electron window

  stress:
    # The stress tests (npm run test:stress): the buddies and the protocol
    # fuzz, deterministic, a couple of minutes, on Linux and Windows; each
    # night, 30 minutes of random seeds.
    name: stress (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:stress
        env:
          STRESS_MINUTES: ${{ github.event_name == 'schedule' && 30 || 0 }}

  release:
    needs: [build, test, stress, perf]
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (main @ ${GITHUB_SHA::7})" \
            --notes "Built from main at $GITHUB_SHA."

  relay:
    # The relay and the teammate's page (relay/wrangler.toml), from the
    # same commit as the nightly.
    needs: [build, test, stress, perf]
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix relay
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
