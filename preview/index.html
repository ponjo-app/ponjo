<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://infer.ponjo.app; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:">
  <title>Ponjo</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="doc-stub.js"></script>
  <script type="module" src="app.js" blocking="render"></script>
</head>
<body>
  <aside class="pj-files" aria-label="Files in this folder" hidden>
    <div class="pj-files-head">
      <span class="pj-files-icon" data-icon="folder"></span>
      <span class="pj-files-name"></span>
    </div>
    <ul class="pj-files-tree" role="tree" aria-label="Files"></ul>
    <div class="pj-files-find"><button type="button" class="pj-files-mode" aria-pressed="false" aria-label="Search in files" data-tip="Search in files" data-keys="Mod+Shift+F">/</button><input class="pj-files-filter" type="text" placeholder="Filter by regex" aria-label="Filter files by regular expression" spellcheck="false" autocomplete="off"><span class="pj-find-options" hidden></span></div>
    <div class="pj-files-resize"></div>
  </aside>

  <header class="pj-header">
    <button class="pj-icon-btn pj-files-toggle" type="button" data-icon="sidebar" data-tip="Hide files" aria-label="Files in this folder" aria-pressed="true" hidden></button>
    <div class="pj-title">
      <span class="pj-doc-icon" data-icon="file"></span>
      <span class="pj-doc-name"></span>
      <span class="pj-preview-name"></span>
      <span class="pj-status" role="status" aria-live="polite" hidden>
        <span class="pj-status-icon"></span><span class="pj-status-text"></span>
      </span>
    </div>
    <span class="pj-spacer"></span>
    <div class="pj-people">
      <div class="pj-agents" aria-label="Who is in this doc"></div>
      <button class="pj-me" type="button"></button>
      <button class="pj-invite" type="button" data-icon="users" data-tip="Team" aria-label="Team" aria-haspopup="dialog"></button>
    </div>
    <button class="pj-icon-btn pj-settings-toggle" type="button" data-icon="settings" data-tip="Settings" data-keys="Mod+," aria-label="Settings" aria-haspopup="dialog"></button>
  </header>

  <div class="pj-panel" role="dialog" aria-label="Profile" hidden></div>

  <div class="pj-toolbar" role="toolbar" aria-label="Formatting">
    <span class="pj-spacer"></span>
    <span class="pj-save" data-state="saved"><span class="pj-save-icon"></span><span class="pj-save-text">Saved</span></span>
    <button type="button" class="pj-pill pj-tool-comment" data-action="comments" data-icon="comment" aria-pressed="true" aria-label="Comments" data-tip="Hide comments"><span class="pj-comment-count"></span></button>
    <button type="button" class="pj-pill pj-show-resolved" data-icon="checkCircle" aria-pressed="false" aria-label="Resolved comments" data-tip="Show resolved comments"></button>
    <button type="button" class="pj-pill pj-tool-history" data-icon="history" aria-pressed="false" aria-label="Version history" data-tip="Version history" data-keys="Mod+Alt+Shift+H"></button>
    <button type="button" class="pj-pill pj-tool-runs" data-icon="code" aria-pressed="false" aria-label="Runs" data-tip="Runs" hidden></button>
  </div>

  <div class="pj-history-bar" role="toolbar" aria-label="Version history">
    <button type="button" class="pj-back" data-action="close" data-icon="back" data-tip="Back to editing" data-keys="Escape">Back</button>
    <span class="pj-history-heading" role="status" aria-live="polite"></span>
    <span class="pj-spacer"></span>
    <label class="pj-history-changes"><input type="checkbox" checked> Show changes</label>
    <button type="button" class="pj-secondary pj-history-undo" data-action="undo" hidden>Undo this change</button>
    <button type="button" class="pj-primary pj-history-restore" data-action="restore" hidden>Restore this version</button>
  </div>

  <div class="pj-runs-bar" role="toolbar" aria-label="Runs">
    <button type="button" class="pj-back" data-action="close" data-icon="back" data-tip="Back to editing" data-keys="Escape">Back</button>
    <span class="pj-history-heading" role="status" aria-live="polite"></span>
  </div>

  <div class="pj-banner pj-notice" hidden>
    <span class="pj-banner-icon" data-icon="alert"></span>
    <span class="pj-banner-text"></span>
    <button type="button" data-action="any-size" hidden></button>
  </div>
  <div class="pj-banner pj-read-only" hidden>
    <span class="pj-banner-icon" data-icon="alert"></span>
    <span class="pj-banner-text"></span>
    <button type="button" data-action="update">Get the update</button>
    <button type="button" data-action="start-over">Start new comments</button>
    <button type="button" data-action="reveal"></button>
  </div>
  <div class="pj-banner pj-missing" hidden>
    <span class="pj-banner-icon" data-icon="alert"></span>
    <span class="pj-banner-text"></span>
    <button type="button" data-action="recreate">Save it here again</button>
  </div>

  <main class="pj-canvas">
    <div class="pj-stage">
      <article class="pj-page" aria-label="Document">
        <div class="pj-editor"></div>
      </article>
      <aside class="pj-margin" aria-label="Comments"></aside>
    </div>
    <div class="pj-preview" aria-label="File, read only"></div>
    <div class="pj-folder-empty">
      <p class="pj-empty">No docs here yet.</p>
      <button class="pj-primary" type="button" data-kind="file">New doc</button>
      <button class="pj-secondary" type="button" data-kind="folder">New folder</button>
    </div>
    <div class="pj-stage pj-history-stage">
      <article class="pj-page" aria-label="Earlier version of the document">
        <div class="pj-editor"></div>
      </article>
      <aside class="pj-history" aria-label="Versions">
        <ol class="pj-history-list" role="listbox" aria-label="Versions" tabindex="0"></ol>
      </aside>
    </div>
    <div class="pj-stage pj-runs-stage">
      <article class="pj-page pj-trace" aria-label="The run's trace"></article>
      <aside class="pj-history" aria-label="Runs">
        <ol class="pj-history-list" role="listbox" aria-label="Runs" tabindex="0"></ol>
      </aside>
    </div>
  </main>

  <div class="pj-tip" role="tooltip" hidden></div>

  <form class="pj-join" hidden>
    <div class="pj-card-title">Join this room</div>
    <p class="pj-join-text">Pick the name others see you by.</p>
    <input class="pj-input" type="text" maxlength="64" spellcheck="false" autocomplete="nickname" aria-label="Your name" placeholder="Your name">
    <div class="pj-input-error" hidden></div>
    <button class="pj-primary" type="submit">Join</button>
  </form>

</body>
</html>
